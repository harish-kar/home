<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A2A4A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" rx="10" fill="url(#bg)" />

  <!-- AlgoCRYPT (main title) -->
  <text x="400" y="115" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="64" font-weight="700" text-anchor="middle" letter-spacing="3">
      <tspan fill="#E8F0FE">Al</tspan><tspan fill="#00F0FF">go</tspan><tspan fill="#E8F0FE">CRYPT CoE</tspan>
  </text>

  <!-- Straight solid line -->
  <line x1="280" y1="190" x2="520" y2="190" stroke="#00F0FF" stroke-width="2" opacity="0.7" />

  <!-- AI Research (below the line) -->
  <text x="400" y="225" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="18" font-weight="300" fill="#88B0E0" text-anchor="middle" letter-spacing="6">
    AI RESEARCH
  </text>
</svg>